services:
  mikroclear-web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: mikroclear-web:local
    container_name: mikroclear-web
    restart: unless-stopped
    env_file:
      - \${MIKROCLEAR_WEB_ENV_FILE:-docker/web/mikroclear-web.env}
    ports:
      - "127.0.0.1:\${MIKROCLEAR_WEB_PUBLISH_PORT:-8080}:8080"
    volumes:
      - \${MIKROCLEAR_EVE_HOST_PATH:-/opt/SELKS/docker/containers-data/suricata/logs/eve.json}:/data/eve.json:ro
      - \${MIKROCLEAR_CERTS_HOST_DIR:-./docker-data/certs}:/etc/mikroclear/certs:ro
      - mikroclear_web_state:/var/lib/mikroclear
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    stop_grace_period: 10s
    networks:
      - mikroclear_web

networks:
  mikroclear_web:
    driver: bridge

volumes:
  mikroclear_web_state:
